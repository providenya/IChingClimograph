<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>기후 주역</title>
    <style>
      .center {
        text-align: center;
      }
      button {
        background-color: #B5D692; /* Green */
        border: none;
        color: white;
        padding: 15px 32px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="center">
      <h1>기후 주역</h1>
      <p>선택하세요</p>
      <button onclick="location.href='ichingclimograph_prompt_v2.1.html'">기후역 해석 프롬프트 v2.1</button>
      <button onclick="location.href='IChingClimograph.html'">기후역 전문</button>
      <button onclick="location.href='고도카드 v4.html'">고도카드</button>
      <button onclick="location.href='고도역 886 v1.html'">주역 8</button>
      <button onclick="toggleButtons()">Show/Hide</button>
      <div id="unusedButtons" class="hidden">
        <button onclick="location.href='고도역384 v5.html'">고도384</button>
        <button onclick="location.href='주역 3변서 v6.html'">(주역3변서)</button>
      </div>
    </div>
    <script>
      function toggleButtons() {
        var x = document.getElementById("unusedButtons");
        if (x.classList.contains("hidden")) {
          x.classList.remove("hidden");
        } else {
          x.classList.add("hidden");
        }
      }
    </script>
  </body>
</html>
